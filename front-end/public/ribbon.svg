<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="42" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="watercolor2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g filter="url(#watercolor)" opacity="0.55">
    <path d="M -50 80 C 80 40, 200 120, 360 70 S 560 130, 700 90 L 700 180 C 540 220, 380 160, 240 200 S 60 200, -50 220 Z"
          fill="#EAC7CD"/>
  </g>

  <g filter="url(#watercolor2)" opacity="0.5">
    <path d="M -50 220 C 100 180, 240 260, 380 220 S 580 270, 700 240 L 700 360 C 560 400, 400 340, 260 380 S 80 380, -50 400 Z"
          fill="#C97C8B"/>
  </g>

  <g filter="url(#watercolor)" opacity="0.45">
    <path d="M -50 380 C 90 340, 220 420, 380 380 S 600 440, 700 410 L 700 520 C 540 560, 360 500, 220 540 S 80 540, -50 560 Z"
          fill="#B98F53"/>
  </g>

  <g filter="url(#watercolor2)" opacity="0.4">
    <path d="M -50 520 C 100 480, 260 560, 400 520 S 600 580, 700 550 L 700 660 L -50 660 Z"
          fill="#A85566"/>
  </g>
</svg>
